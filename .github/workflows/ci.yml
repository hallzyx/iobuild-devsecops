name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  agent-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify agent integration
        run: node scripts/verify-agent-compatibility.mjs

  build-config-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check tracked build configurations
        run: node scripts/verify-build-config-hygiene.mjs
      - name: Test build-configuration policy
        run: node --test scripts/verify-build-config-hygiene.test.mjs

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore backend/IoBuild.sln

      - name: Build
        run: dotnet build backend/IoBuild.sln --no-restore

      - name: Test (Gate 1 — Tier A fast)
        run: dotnet test backend/IoBuild.sln --no-restore --verbosity minimal --filter "Risk=A"

      - name: Test (Gate 2 — full convergence suite)
        run: dotnet test backend/IoBuild.sln --no-restore --verbosity minimal

      - name: Guard MySQL engine version (8.0)
        run: |
          if grep -R "mysql:8\.4" backend/tests --include="*.sh"; then echo "mysql:8.4 proof script found"; exit 1; fi
          grep -R "mysql:8\.0" backend/tests/Integration --include="*.sh"

      - name: Docker build (monolith)
        run: docker build -f backend/Dockerfile -t iobuild-api:ci ./backend

      - name: Docker build (frontend)
        run: docker build -t iobuild-frontend:ci ./frontend

      - name: Compose config validation
        run: docker compose -f docker-compose.yml config

      - name: Dokploy Compose config validation
        run: docker compose -f docker-compose.dokploy.yml config -q
        env:
          INFLUXDB_ADMIN_PASSWORD: ci-only-password
          INFLUXDB_ADMIN_TOKEN: ci-only-token
          MQTT_PASSWORD: ci-only-mqtt-password

      - name: Compose up (smoke)
        run: docker compose -f docker-compose.yml up -d --wait

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -f http://localhost:8081/health || curl -f http://localhost:8080/health; then
              echo "health ok on attempt $i"
              exit 0
            fi
            echo "waiting for health ($i/30)..."
            sleep 5
          done
          echo "health check failed"
          docker compose -f docker-compose.yml logs iobuild-api
          docker compose -f docker-compose.yml logs nginx
          exit 1

      - name: Curl health endpoint
        run: |
          curl -f http://localhost:8081/health
          curl -f http://localhost:8081/api/v1/cutover/status || true

      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Unit (Vitest — validators and Tier A)
        run: npm run test:unit
        working-directory: frontend

  frontend-e2e:
    runs-on: ubuntu-latest
    env:
      # Dummy publishable key for the dist build (baked in at compose build
      # time): simulated Stripe never loads Stripe.js (checkout returns a
      # same-origin URL), but the view refuses to start checkout without the
      # key present.
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_e2e_ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Compose up (system under test)
        run: docker compose -f docker-compose.yml up -d --wait
      - name: E2E (Playwright — IAM journeys per actor)
        run: E2E_BASE_URL=http://localhost:8081 npx playwright test
        working-directory: frontend
        env:
          CI: true
      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with TruffleHog (fail closed)
        run: |
          set -euo pipefail
          scan_log="$(mktemp)"
          trap 'rm -f "$scan_log"' EXIT

          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/trufflesecurity/trufflehog@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076 \
            git file:///repo --branch HEAD --results=verified --fail --no-update \
            >"$scan_log" 2>&1
          scan_status=$?
          set -e

          if [ "$scan_status" -ne 0 ]; then
            echo "::error::TruffleHog exited with status $scan_status"
            exit "$scan_status"
          fi

          if grep -q 'encountered errors during scan' "$scan_log"; then
            echo "::error::TruffleHog reported a scan error"
            exit 1
          fi

          summary="$(grep 'finished scanning' "$scan_log" | tail -n 1 | awk -F '\t' '{print $NF}')"
          if [ -z "$summary" ]; then
            echo "::error::TruffleHog did not emit a completion summary"
            exit 1
          fi

          chunks="$(printf '%s\n' "$summary" | jq -r '.chunks // 0')"
          bytes="$(printf '%s\n' "$summary" | jq -r '.bytes // 0')"
          verified_secrets="$(printf '%s\n' "$summary" | jq -r '.verified_secrets // 0')"
          if [ "$chunks" -le 0 ] || [ "$bytes" -le 0 ]; then
            echo "::error::TruffleHog scanned zero content (chunks=$chunks, bytes=$bytes)"
            exit 1
          fi
          if [ "$verified_secrets" -ne 0 ]; then
            echo "::error::TruffleHog found $verified_secrets verified secret(s)"
            exit 1
          fi

          echo "TruffleHog scanned $chunks chunks / $bytes bytes; no verified secrets found."

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Audit frontend (gate on critical)
        run: npm audit --audit-level=critical
        working-directory: frontend
      - name: Audit backend (fail on high/critical only)
        run: |
          out=$(dotnet list backend/IoBuild.sln package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -qi "has the following vulnerable packages"; then
            if echo "$out" | grep -qiE "[[:space:]](High|Critical)([[:space:]]|$)"; then exit 1; fi
            echo "Only moderate-or-lower advisories present; tracked as an owned risk, not blocking."
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript
      - name: Restore and build for analysis
        run: |
          dotnet restore backend/IoBuild.sln
          dotnet build backend/IoBuild.sln --no-restore
      - uses: github/codeql-action/analyze@v3

  simulator-smoke:
    runs-on: ubuntu-latest
    if: false # placeholder — simulator harness is profile-gated; run locally with --profile telemetry
    steps:
      - run: echo "simulator smoke via --profile telemetry"
