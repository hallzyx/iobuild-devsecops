# IoBuild Monolith — Final Compose (promoted from docker-compose.cutover.yml)
# One backend (iobuild-api) + one frontend + one MySQL. No YARP gateway, no RabbitMQ, no Redis.
# Optional integrations (jaeger/influx/mosquitto/simulator) are profile-gated; core stack runs without them.

services:
  iobuild-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iobuild-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__IoBuild=${ConnectionStrings__IoBuild:-Server=mysql-monolith;Port=3306;Database=iobuild;User=root;Password=${DB_PASSWORD:-iobuild}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - Migrations__ApplyOnStartup=true
      - Mqtt__Enabled=true
      - Mqtt__Host=mosquitto
      - Mqtt__Port=1883
      - Influx__Url=http://influxdb:8086
      - Influx__Org=iobuild
      - Influx__Bucket=iobuild-telemetry
      - Influx__Token=iobuild-telemetry-token
      - Jwt__Secret=${JWT_SECRET:-iobuild-production-secret-must-be-replaced-in-prod-32chars!}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-*}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Stripe__PublishableKey=${VITE_STRIPE_PUBLISHABLE_KEY:-}
      - Stripe__RestrictedApiKey=${STRIPE_RESTRICTED_API_KEY:-rk_test_local}
      - Stripe__UseSimulatedPayments=${STRIPE_USE_SIMULATED_PAYMENTS:-true}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-whsec_local_dev}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME:-}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY:-}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET:-}
    depends_on:
      mysql-monolith:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - iobuild-network
    expose:
      - "8080"
    ports:
      - "8080:8080"
      - "5080:8080"

  mysql-monolith:
    image: mysql:8.0
    container_name: iobuild-mysql-monolith
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild}
      - MYSQL_DATABASE=iobuild
    volumes:
      - mysql_monolith_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iobuild-network

  # Frontend — Vue SPA built via Vite (nginx serves dist)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
        - VITE_CLOUDINARY_UPLOAD_PRESET=${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}
    container_name: iobuild-frontend
    restart: unless-stopped
    depends_on:
      - iobuild-api
    networks:
      - iobuild-network
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: iobuild-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - iobuild-api
      - frontend
    networks:
      - iobuild-network

  # Jaeger — optional OTLP collector; app starts healthy when absent
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: iobuild-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - iobuild-network
    profiles:
      - observability
      - full

  # InfluxDB — optional telemetry sink (profile-gated)
  influxdb:
    image: influxdb:2.7-alpine
    container_name: iobuild-influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=iobuild
      - DOCKER_INFLUXDB_INIT_BUCKET=iobuild-telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=iobuild-telemetry-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - iobuild-network
    profiles:
      - telemetry
      - full

  # Mosquitto — MQTT broker
  mosquitto:
    image: eclipse-mosquitto:2-openssl
    container_name: iobuild-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - iobuild-network

  # Simulator — dynamic IoT telemetry generator
  simulator:
    build:
      context: ./iot-simulator
      dockerfile: Dockerfile
    container_name: iobuild-simulator
    restart: unless-stopped
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    networks:
      - iobuild-network

networks:
  iobuild-network:
    driver: bridge

volumes:
  mysql_monolith_data:
    driver: local
  influxdb_data:
    driver: local
  mosquitto_data:
    driver: local
