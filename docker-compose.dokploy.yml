# Standalone Dokploy stack. Set Compose Path to ./docker-compose.dokploy.yml.
# Configure Domains in Dokploy (which adds routing labels and network):
#   frontend:80       host root / (Vue SPA)
#   iobuild-api:8080  same host, paths /api, /swagger, /health
# Disable Strip Path for the API; it expects /api/v1/... unchanged.
# Remove the old nginx Domain entry before redeploying. No aggregator is run;
# the frontend image still uses its own nginx to serve static files.
# Keep the same Dokploy project name to reuse the existing MySQL volume.
# Set INFLUXDB_ADMIN_PASSWORD and INFLUXDB_ADMIN_TOKEN in Dokploy before deploy.
# Set MQTT_PASSWORD (and optionally MQTT_USERNAME, default iobuild) in Dokploy: the broker
# rejects anonymous clients and the API and simulator connect with these credentials.

services:
  iobuild-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iobuild-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__IoBuild=${ConnectionStrings__IoBuild:-Server=mysql-monolith;Port=3306;Database=iobuild;User=root;Password=${DB_PASSWORD:-iobuild}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - Migrations__ApplyOnStartup=true
      - Mqtt__Enabled=true
      - Mqtt__Host=mosquitto
      - Mqtt__Port=1883
      - Mqtt__Username=${MQTT_USERNAME:-iobuild}
      - Mqtt__Password=${MQTT_PASSWORD:?Set MQTT_PASSWORD in Dokploy}
      - Influx__Url=http://influxdb:8086
      - Influx__Org=iobuild
      - Influx__Bucket=iobuild-telemetry
      - Influx__Token=${INFLUXDB_ADMIN_TOKEN:?Set INFLUXDB_ADMIN_TOKEN in Dokploy}
      - Jwt__Secret=${JWT_SECRET:-iobuild-production-secret-must-be-replaced-in-prod-32chars!}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-*}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Stripe__PublishableKey=${VITE_STRIPE_PUBLISHABLE_KEY:-}
      - Stripe__RestrictedApiKey=${STRIPE_RESTRICTED_API_KEY:-rk_test_local}
      - Stripe__UseSimulatedPayments=${STRIPE_USE_SIMULATED_PAYMENTS:-true}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-whsec_local_dev}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME:-}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY:-}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET:-}
    depends_on:
      mysql-monolith:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - iobuild-network
    expose:
      - "8080"

  mysql-monolith:
    image: mysql:8.0
    container_name: iobuild-mysql-monolith
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild}
      - MYSQL_DATABASE=iobuild
    volumes:
      - mysql_monolith_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iobuild-network

  # Production database UI — publish only through a protected Dokploy Domain.
  # Do not add a host `ports` mapping here; Traefik routes to container port 80.
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: iobuild-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql-monolith
      PMA_PORT: 3306
    depends_on:
      mysql-monolith:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - iobuild-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
        - VITE_CLOUDINARY_UPLOAD_PRESET=${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}
    container_name: iobuild-frontend
    restart: unless-stopped
    depends_on:
      - iobuild-api
    networks:
      - iobuild-network
    expose:
      - "80"

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: iobuild-jaeger
    restart: unless-stopped
    expose:
      - "16686"
      - "4317"
      - "4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - iobuild-network
    profiles:
      - observability
      - full

  influxdb:
    image: influxdb:2.7-alpine
    container_name: iobuild-influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?Set INFLUXDB_ADMIN_PASSWORD in Dokploy}
      - DOCKER_INFLUXDB_INIT_ORG=iobuild
      - DOCKER_INFLUXDB_INIT_BUCKET=iobuild-telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:?Set INFLUXDB_ADMIN_TOKEN in Dokploy}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - iobuild-network

  mosquitto:
    image: eclipse-mosquitto:2-openssl
    container_name: iobuild-mosquitto
    restart: unless-stopped
    # MQTT clients outside Docker connect directly to the VPS; Traefik Domains
    # only handles HTTP and cannot replace this TCP port mapping.
    ports:
      - "1883:1883"
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-iobuild}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?Set MQTT_PASSWORD in Dokploy}
    # Build the password file from the environment so no secret lives in the repo.
    command: >
      sh -c 'mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
      && chown mosquitto:mosquitto /mosquitto/config/passwd
      && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mosquitto/config/mosquitto.auth.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - iobuild-network

  simulator:
    build:
      context: ./iot-simulator
      dockerfile: Dockerfile
    container_name: iobuild-simulator
    restart: unless-stopped
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-iobuild}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?Set MQTT_PASSWORD in Dokploy}
    depends_on:
      - mosquitto
    networks:
      - iobuild-network

networks:
  iobuild-network:
    driver: bridge

volumes:
  mysql_monolith_data:
    driver: local
  influxdb_data:
    driver: local
  mosquitto_data:
    driver: local
